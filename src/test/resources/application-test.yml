spring:
  datasource:
    url: jdbc:h2:mem:finflow;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  data:
    redis:
      repositories:
        enabled: false
  kafka:
    bootstrap-servers: localhost:9092
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://example.invalid/test
app:
  kafka:
    transfer-created-topic: transfer.created.v1
    transfer-completed-topic: transfer.completed.v1
  security:
    jwt-secret: "01234567890123456789012345678901"
    issuer: "finflow-test"
