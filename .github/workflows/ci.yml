name: ci

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: finflow
          POSTGRES_USER: finflow
          POSTGRES_PASSWORD: finflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finflow -d finflow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7.4
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Temurin 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build and test
        run: mvn -B clean verify

      - name: Dependency scan
        run: mvn -B org.owasp:dependency-check-maven:check
        continue-on-error: true

      - name: Build image
        run: docker build -t finflow/transaction-platform:${{ github.sha }} .

  deploy-staging:
    if: github.ref == 'refs/heads/main'
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - name: Placeholder deploy step
        run: echo "Deploy via helm upgrade --install in staging"
